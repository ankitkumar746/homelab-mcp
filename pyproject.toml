[project]
name = "homelab-mcp"
version = "0.1.0"
description = "MCP server for providing live context from my Proxmox homelab into llm sessions"
readme = "README.md"
authors = [
    { name = "Ankit Kumar", email = "ankitkumarakt746@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
