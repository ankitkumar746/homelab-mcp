cluster:
  - name: homelab
    host:
      - name: wpa_supplicant
        type: wifi
        service_name: wpa_supplicant@wlp12s0.service
        critical: true
        configs:
          - directory: /etc/wpa_supplicant
            files:
              - path: wpa_supplicant-wlp12s0.conf
                description: WiFi SSID and PSK
        note: WiFi uplink, if this fails no internet for host or VMs
      
      - name: pve-firewall
        type: firewall
        service_name: pve-firewall
        configs:
          - directory: /etc/pve/nodes/homelab
            files:
              - path: host.fw
                description: Host-level firewall rules
          - directory: /etc/pve/firewall
            files:
              - path: cluster.fw
                description: Cluster-level firewall rules
        live_command: iptables-save
        note: Allows SSH/ICMP/8006 from 192.168.29.15, vmbr1 subnet, drops rest
    
    vms:
      - name: infravm
        services:
          - name: dnsmasq
            type: dhcp_dns_tftp
            service_name: dnsmasq
            configs:
              - directory: /etc/dnsmasq.d
                files:
                  - path: dhcp.conf
                    description: DHCP range, interface binding, gateway, DNS
                  - path: tftp-ipxe.conf
                    description: PXE boot and TFTP server
                  - path: logging.conf
                    description: DHCP/DNS logging
            log_file: /var/log/dnsmasq.log
          
          - name: nginx
            type: http_server
            service_name: nginx
            configs:
              - directory: /etc/nginx/sites-available
                files:
                  - path: pxe
                    description: PXE HTTP server for debian ISO and preseed
            document_root: /var/www/html
          
          - name: pxe-boot
            type: pxe
            configs:
              - directory: /srv/tftp/pxelinux.cfg
                files:
                  - path: default
                    description: PXE boot menu
              - directory: /var/www/html/pxe/preseed
                files:
                  - path: debian.cfg
                    description: Debian preseed for automated install
    
    lxc:
      - name: netbox01
        services:
          - name: docker
            type: container_runtime
            service_name: docker
            note: Docker Engine + containerd; runs the netbox-docker compose stack

          - name: netbox
            type: netbox_ipam
            note: NetBox 4.5.10 (docker compose service, custom image with netbox-topology-views plugin). Web on port 8000->8080, Granian 2 workers.
            configs:
              - directory: /opt/netbox-docker
                files:
                  - path: docker-compose.yml
                    description: Stock netbox-docker compose (service definitions)
                  - path: docker-compose.override.yml
                    description: Local overrides - custom image build, memory caps, postgres/redis tuning
                  - path: Dockerfile.custom
                    description: Custom image build with topology-views plugin
              - directory: /opt/netbox-docker/configuration
                files:
                  - path: configuration.py
                    description: NetBox main configuration (DB, redis, allowed hosts)
                  - path: plugins.py
                    description: Plugin configuration (netbox_topology_views)
                  - path: logging.py
                    description: NetBox logging configuration
              - directory: /opt/netbox-docker/env
                files:
                  - path: netbox.env
                    description: NetBox env/secrets (SECRET_KEY, DB password) - sensitive
                  - path: postgres.env
                    description: PostgreSQL credentials - sensitive

          - name: netbox-worker
            type: netbox_rq_worker
            note: Redis Queue worker (docker compose service, same custom image)

          - name: netbox-housekeeping
            type: netbox_housekeeping
            note: Scheduled cleanup jobs (docker compose service)

          - name: postgres
            type: postgresql
            note: PostgreSQL 17 (docker compose service, tuned for <100-object DB)

          - name: redis
            type: redis
            note: Redis for queueing/caching (docker compose service, 50mb lru)

          - name: redis-cache
            type: redis
            note: Dedicated Redis cache (docker compose service, 50mb lru)
