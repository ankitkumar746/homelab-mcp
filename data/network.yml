cluster:
  - name: homelab
    nics:
      - name: nic0
        status: down
        altname: enx345a601ef7b5
        mac: 34:5a:60:1e:f7:b5
        note: Wired ethernet, not used, no cable connected
      - name: wlp12s0
        status: up
        mac: ec:91:61:da:e3:c7
        note: WiFi card, active uplink, main interface for internet
    
    wan:
      interface: wlp12s0
      ip: 192.168.29.167
      subnet: 192.168.29.0/24
      ssid: silk_route_
      wpa_config: /etc/wpa_supplicant/wpa_supplicant-wlp12s0.conf
      wpa_service: wpa_supplicant@wlp12s0.service
    
    bridges:
      - name: vmbr0
        ip: 192.168.100.2
        subnet: 192.168.100.0/24
        gateway: 192.168.100.1
        bridge_ports: nic0
        autostart: false
        status: inactive
        note: Wired bridge, not used, commented out in /etc/network/interfaces
      
      - name: vmbr1
        ip: 192.168.200.1
        subnet: 192.168.200.0/24
        bridge_ports: none
        autostart: true
        status: active
        note: Internal VM network, isolated, no physical NIC
      
    ip_forwarding:
      enabled: true
      param: net.ipv4.ip_forward
      config: /etc/sysctl.d/sysctl.conf
    
    nat:
      enabled: true
      type: masquerade
      backend: iptables
      source_subnet: 192.168.200.0/24
      outbound_interface: wlp12s0
      config: /etc/network/if-up.d/masquerade
      note: VMs on vmbr1 get internet via WiFi through iptables MASQUERADE
    
    host:
      configs:
        - directory: /etc/network
          files:
            - path: interfaces
              description: Interface and bridge definitions
            - path: if-up.d/masquerade
              description: iptables MASQUERADE rule, runs on interface up
        - directory: /etc/sysctl.d
          files:
            - path: sysctl.conf
              description: Kernel param for IP forwarding
        - directory: /etc/pve/nodes/homelab
          files:
            - path: host.fw
              description: Host-level firewall rules
        - directory: /etc/pve/firewall
          files:
            - path: cluster.fw
              description: Cluster-level firewall rules
        - directory: /etc
          files:
            - path: hosts
              description: Hostname to IP mappings
            - path: resolv.conf
              description: DNS resolution configuration
            - path: hostname
              description: Hostname configuration
    
    vms:
      - name: infravm
        interfaces:
          - name: ens18
            bridge: vmbr1
            ip: 192.168.200.50
        dhcp_scope:
          service: dnsmasq
          interface: ens18
          range_start: 192.168.200.51
          range_end: 192.168.200.200
          lease_time: 12h
          gateway: 192.168.200.1
          dns_servers: [1.1.1.1, 8.8.8.8]
        pxe:
          service: dnsmasq
          bootloader: pxelinux
          boot_file: pxelinux.0
          tftp_root: /srv/tftp
          http_root: /var/www/html
        configs:
          - directory: /etc/dnsmasq.d
            files:
              - path: dhcp.conf
                description: DHCP range, interface binding, gateway, DNS
              - path: tftp-ipxe.conf
                description: PXE boot and TFTP server
              - path: logging.conf
                description: DHCP/DNS logging
          - directory: /etc/nginx/sites-available
            files:
              - path: pxe
                description: HTTP server for PXE and debian ISO
          - directory: /srv/tftp/pxelinux.cfg
            files:
              - path: default
                description: PXE boot menu
          - directory: /var/www/html/pxe/preseed
            files:
              - path: debian.cfg
                description: Debian preseed for automated install
    
    lxc: []